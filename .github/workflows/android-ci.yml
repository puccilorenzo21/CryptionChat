name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      # Difesa in profondità CVE-2026-114938 ("Java4Shell") sui runner x86-64
      JAVA_TOOL_OPTIONS: -XX:-UseBASE64Intrinsics

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up patched JDK 21 (CVE-2026-114938 fix)
        uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: '21'
          check-latest: true

      - name: Verify JDK version and CVE-2026-114938 mitigation
        run: |
          java -version
          java -XX:+PrintFlagsFinal -version 2>&1 | grep -i UseBASE64Intrinsics

      - name: Accept Android SDK Licenses & Install SDK Packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-37.0" "build-tools;37.0.0" "cmake;3.22.1"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build Release APK (Unsigned)
        run: ./gradlew assembleRelease --no-daemon
